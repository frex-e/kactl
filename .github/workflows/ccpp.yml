name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Install pdflatex
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-plain-generic \
          texlive-fonts-recommended
    - name: Build pdf
      run: make kactl
    - name: Run preprocess tests
      run: make test-preprocess
    - name: Run compiles
      run: make test-compiles
    - name: Run stress tests
      run: make test
